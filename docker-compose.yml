# The stack as it is deployed: PostgreSQL, the Spring Boot API, and nginx serving the Angular app.
#
# Nothing here is published on the host. Only `web` needs to be reachable, on container port 80:
#   - locally, docker-compose.override.yml (picked up automatically) publishes it on
#     http://localhost:4200, together with the API and the database for development;
#   - on a server, a reverse proxy (Traefik in Dokploy or Coolify, Caddy, ...) routes to web:80.
#
#   docker compose up --build        local: this file plus the override
#   docker compose up db             local: only the database, for running the API from an IDE
#
# Set DB_PASSWORD before the first start on a server. The default is for local use only.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trabecula
      POSTGRES_USER: trabecula
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trabecula}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      # Over TCP on purpose: during first start the image runs a temporary server that only
      # listens on the unix socket, and that one must not count as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U trabecula -d trabecula"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/trabecula
      DB_USER: trabecula
      DB_PASSWORD: ${DB_PASSWORD:-trabecula}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      # The port opens at the end of start-up, after the migrations and the demo seeding.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    # Listed explicitly so that a platform which attaches its proxy network to this service
    # adds to this list instead of replacing the network the API is reached on.
    networks:
      - default

volumes:
  db-data:
